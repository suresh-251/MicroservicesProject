name: Build and Push Microservices (Docker Compose)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17 (for Maven build inside Docker)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 4️⃣ Build Docker images using Docker Compose
      - name: Build images with Docker Compose
        run: docker-compose build

      # 5️⃣ Push Docker images to Docker Hub
      - name: Push images with Docker Compose
        run: docker-compose push
