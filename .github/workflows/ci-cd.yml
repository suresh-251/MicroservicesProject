name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    steps:
      # -------------------
      # 1. Checkout code
      # -------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -------------------
      # 2. Set up Java
      # -------------------
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # -------------------
      # 3. Build microservices
      # -------------------
      - name: Build all microservices
        run: mvn clean package -DskipTests

      # -------------------
      # 4. Set up Docker
      # -------------------
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # -------------------
      # 5. Log in to Docker Hub
      # -------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # -------------------
      # 6. Build & push Docker images
      # -------------------
      - name: Build & Push Images
        run: |
          # API Gateway
          docker build -t $DOCKER_HUB_USERNAME/api-gateway:latest ./api-gateway
          docker push $DOCKER_HUB_USERNAME/api-gateway:latest

          # Eureka Server
          docker build -t $DOCKER_HUB_USERNAME/eureka-server:latest ./discovery-server
          docker push $DOCKER_HUB_USERNAME/eureka-server:latest

          # User Service
          docker build -t $DOCKER_HUB_USERNAME/user-service:latest ./user-service
          docker push $DOCKER_HUB_USERNAME/user-service:latest

          # Order Service
          docker build -t $DOCKER_HUB_USERNAME/order-service:latest ./order-service
          docker push $DOCKER_HUB_USERNAME/order-service:latest

          # Product Service
          docker build -t $DOCKER_HUB_USERNAME/product-service:latest ./product-service
          docker push $DOCKER_HUB_USERNAME/product-service:latest

          # Payment Service
          docker build -t $DOCKER_HUB_USERNAME/payment-service:latest ./payment-service
          docker push $DOCKER_HUB_USERNAME/payment-service:latest
